services:
  docker:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
    networks:
      - cicd

  jenkins:
    build:
      context: ./jenkins
    container_name: enterprise-jenkins
    restart: unless-stopped
    depends_on:
      - docker
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    networks:
      - cicd

  sonar-db:
    image: postgres:18-alpine
    container_name: enterprise-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_lab_password_change_me
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql
    networks:
      - cicd

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: enterprise-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_lab_password_change_me
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - cicd

networks:
  cicd:
    name: enterprise-cicd

volumes:
  jenkins-home:
  jenkins-docker-certs:
  jenkins-docker-data:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
